server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # SPA fallback: unknown paths are client-side routes, serve the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell, otherwise clients pin an old asset manifest
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The service worker itself must always be re-checked, or a fix to its
    # caching (like serving pages network-first) reaches users late.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames here, safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}
