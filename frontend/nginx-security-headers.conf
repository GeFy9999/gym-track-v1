# Security headers for every response. nginx drops server-level add_header
# directives inside any location that sets its own, so nginx.conf includes
# this file in each of those locations too.
#
# No script-src CSP on purpose: Google Sign-In loads its own scripts and
# frames, and a too-strict allowlist would silently break login. These only
# lock down framing (clickjacking), MIME sniffing, referrers and APIs the
# app never uses.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), camera=(self)" always;
add_header Strict-Transport-Security "max-age=31536000" always;
